<!--
  GitHub Pages has two modes, and this file covers the one the workflow does
  not.

  With Source = "GitHub Actions", .github/workflows/pages.yml builds the site
  and this file is never served. With Source = "Deploy from a branch" pointed
  at main / root -- which is what GitHub offers first, so it is where most
  repositories end up -- GitHub serves this directory verbatim, and without an
  index.html a visitor gets the 404 page.

  So: a doorway. It costs a few hundred bytes and means the link works under
  either setting, which matters when the link is going to producers rather
  than to somebody who can read a settings page.

  The redirect is a meta refresh rather than script, because it has to survive
  a browser with JavaScript off, and the link below has to survive the refresh
  being ignored.
-->
<meta http-equiv="refresh" content="0; url=OFPE-Guide.html">
<link rel="canonical" href="OFPE-Guide.html">
